<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFDF9">
  <meta name="description" content="Lagbok Desktop: svensk lagtext för Windows. Lagar, förordningar och polisens föreskrifter.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>html,body{background:#FFFDF9}html[data-theme=dark],html[data-theme=dark] body{background:#131D17}</style>
  <script>
    // Startar direkt, innan skripten har lästs in: mörkt läge utan vit blinkning, och katalogen hämtas parallellt med skripten.
    (function(){
      // Lagbok Desktop: Windows-skalet (Tauri) finns; snabbpanelen sätter __LAGBOK_PANEL (eller ?panel=1 vid test).
      window.LAGBOK_DESKTOP=!!(window.__TAURI__||window.__TAURI_INTERNALS__);
      if(window.__LAGBOK_PANEL||/[?&]panel=1\b/.test(location.search))document.documentElement.dataset.panel='true';
      try{var p=JSON.parse(localStorage.getItem('lagboken-settings')||'{}'),dark=p.theme==='dark'||(p.theme==='system'&&p.themeChosen&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme=dark?'dark':'light';}catch(e){}
      window.LAGBOK_EARLY={catalog:window.fetch?fetch('data/index/catalog.json').catch(function(){return null;}):null};
    })();
  </script>
  <link rel="preload" href="assets/lagboken.js" as="script">
  <link rel="stylesheet" href="assets/app.css">
  <title>Lagbok Desktop</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button type="button" class="icon-button" id="back" aria-label="Tillbaka" hidden>‹</button>
      <div class="top-title" id="top-title">Lagboken</div>
      <div class="top-actions">
        <span class="top-version" id="top-version" aria-label="Version"></span>
        <button type="button" class="icon-button" id="in-law-search" aria-label="Gå till lagrum eller sök">⌕</button>
        <button type="button" class="icon-button law-tool" id="find-button" data-action="find-open" aria-label="Sök i författningen" aria-pressed="false" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg></button>
        <button type="button" class="icon-button law-tool" id="pen-button" data-action="pen" aria-label="Penna för markeringar" aria-pressed="false" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></button>
        <button type="button" class="icon-button law-tool" id="toc-button" aria-label="Innehållsförteckning" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".8" fill="currentColor"/><circle cx="4.5" cy="12" r=".8" fill="currentColor"/><circle cx="4.5" cy="18" r=".8" fill="currentColor"/></svg></button>
        <button type="button" class="icon-button" id="menu-button" aria-label="Mer" aria-expanded="false">•••</button>
      </div>
    </header>
    <main id="view" tabindex="-1" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Huvudmeny">
      <button type="button" data-tab="catalog"><span class="nav-icon">▤</span><span>Lagbok & sök</span></button>
      <button type="button" data-tab="saved"><span class="nav-icon">☆</span><span>Sparat</span></button>
    </nav>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Snabbmeny" hidden></aside>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script>
    // Katalogen från förra besöket visas direkt; appen ritar om den när skripten är inlästa.
    (function(){
      try{var h=location.hash;if(h&&h!=='#/catalog'&&h!=='#/home'&&h!=='#/search')return;
        var snap=localStorage.getItem('lagboken-snapshot');if(snap){document.getElementById('view').innerHTML=snap;window.LAGBOK_SNAPSHOT=snap;document.getElementById('top-title').textContent='Lagbok';
          window.LAGBOK_T={snapshot:performance.now()};if(window.requestAnimationFrame)requestAnimationFrame(function(){window.LAGBOK_T.paint=performance.now();});}}catch(e){}
    })();
  </script>
  <script>
    // Appen körs först när första bilden är ritad; filen hämtas redan (preload ovan).
    (function(){
      function load(){var s=document.createElement('script');s.src='assets/lagboken.js';document.body.appendChild(s);}
      if(window.requestAnimationFrame)requestAnimationFrame(function(){setTimeout(load,0);});else setTimeout(load,0);
    })();
  </script>
</body>
</html>
